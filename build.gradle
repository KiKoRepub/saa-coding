plugins {
    id 'java'
//    id "io.spring.dependency-management" version "1.0.9.RELEASE"
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}


ext {
    alibabaVersion = '1.1.0.0'
    springBootVersion = '3.4.5'

    druidVersion = '1.2.23'
    mybatisPlusVersion = '3.5.6'
    mysqlVersion = '8.0.31'

    springAiVersion = '1.1.0-M4'

    hutoolVersion = '5.8.37'
    grpcVersion = '1.39.0'
    lombokVersion = '1.18.30'
    springDocVersion = '2.7.0'

    minioVersion = '8.6.0'

    saTokenVersion = '1.44.0'
}

dependencies {
    implementation platform("io.grpc:grpc-bom:${grpcVersion}")

    // Replace the following with the specific module dependencies (e.g., spring-ai-openai) or starter modules (e.g., spring-ai-starter-model-openai) that you wish to use


    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

subprojects {

    sourceCompatibility = 21
    targetCompatibility = 21

    repositories {
        mavenCentral()
    }
    // 只对已应用 Java 插件的子模块配置依赖
    plugins.withType(JavaPlugin) {
        dependencies {
            implementation platform("io.grpc:grpc-bom:${grpcVersion}")

            // lombok + Swagger
            compileOnly "org.projectlombok:lombok:${lombokVersion}"
            annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
            implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"

            // 其他工具
            implementation "cn.hutool:hutool-all:${hutoolVersion}"
            implementation "com.squareup.okhttp3:okhttp:4.12.0"


            testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
            testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
        }
    }
}
compileJava {
        options.encoding = 'UTF-8'
}



test {
    useJUnitPlatform()
}
